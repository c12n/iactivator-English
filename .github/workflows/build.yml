# Builds iActivator for Windows on GitHub's machines (the Mac version is built locally with build_mac.sh).
# Run it from the repository's Actions tab ("Run workflow"); the result appears as an artifact.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name iActivator --icon assets/icon.ico --collect-all pymobiledevice3 --collect-all webview --collect-submodules keyring --collect-data fpdf --add-data "iactivator/page.html;iactivator" main.py
      - uses: actions/upload-artifact@v7
        with:
          name: iActivator-Windows
          path: dist/iActivator.exe
