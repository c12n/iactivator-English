<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iActivator</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --accent:#0071e3; --danger:#d70015; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --card:#2c2c2e; --text:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c; --accent:#0a84ff; --danger:#ff453a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .row > label:first-child:not(.check) { width:120px; color:var(--muted); }
  input[type=text], input[type=password], select { flex:1; min-width:180px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  .check { display:flex; gap:6px; align-items:center; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions .spacer { flex:1; }
  .info { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px 16px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .info div span { display:block; color:var(--muted); font-size:12px; }
  .info div b { font-weight:600; }
  .good { color:#1a7f37; } .warn { color:#b25e00; } .bad { color:var(--danger); }
  #log { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-height:160px; max-height:320px; overflow:auto; white-space:pre-wrap; font:12px ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>iActivator — активация iPhone</h1>

  <section>
    <h2>Устройство</h2>
    <div class="row">
      <select id="device"><option value="">Поиск…</option></select>
      <button id="refresh">Обновить</button>
    </div>
    <div id="info" class="info" hidden></div>
  </section>

  <section>
    <h2>Язык и регион</h2>
    <div class="row"><label for="language">Язык</label>
      <select id="language"></select>
      <button id="loadLangs">Все языки с iPhone</button>
    </div>
    <div class="row"><label for="region">Регион</label><select id="region"></select></div>
    <div class="row"><label for="timezone">Часовой пояс</label>
      <input type="text" id="timezone" value="Europe/Kyiv">
      <label class="check"><input type="checkbox" id="h24" checked> 24 часа</label>
    </div>
  </section>

  <section>
    <h2>Wi-Fi (необязательно)</h2>
    <div class="row"><label for="ssid">Сеть (SSID)</label><input type="text" id="ssid" autocomplete="off"></div>
    <div class="row"><label for="password">Пароль</label>
      <input type="password" id="password" autocomplete="off">
      <label class="check"><input type="checkbox" id="showPass"> показать</label>
    </div>
    <div class="row"><label for="security">Защита</label><select id="security"></select></div>
    <div class="row">
      <label class="check"><input type="checkbox" id="hidden"> Скрытая сеть</label>
      <label class="check"><input type="checkbox" id="nomac" checked> Отключить «частный адрес» (для фильтра по MAC)</label>
    </div>
    <div class="hint">Активация идёт через интернет компьютера, Wi-Fi нужен только чтобы телефон сразу был в сети.</div>
  </section>

  <section>
    <h2>Параметры</h2>
    <div class="row"><label class="check"><input type="checkbox" id="activate" checked> Активировать через серверы Apple</label></div>
    <div class="row"><label class="check"><input type="checkbox" id="skip" checked> Пропустить экраны настройки (контролируемый режим)</label></div>
    <div class="row"><label for="org">Организация</label><input type="text" id="org" value="iActivator"></div>
  </section>

  <section class="actions">
    <button class="primary" id="start">▶ Запустить</button>
    <button id="wifiOnly">Только Wi-Fi</button>
    <span class="spacer"></span>
    <button class="danger" id="erase">Стереть устройство…</button>
  </section>

  <div id="log"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let logNext = 0;

function fill(select, items, selected) {
  select.innerHTML = "";
  for (const [label, value] of items) {
    const o = document.createElement("option");
    o.value = value; o.textContent = label;
    if (value === selected) o.selected = true;
    select.appendChild(o);
  }
}
function addLog(line) {
  const el = $("log");
  el.textContent += line + "\n";
  el.scrollTop = el.scrollHeight;
}
async function api(path, body) {
  const opts = body ? { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) } : {};
  const r = await fetch(path, opts);
  return r.json();
}

let regions = [];
async function init() {
  const meta = await api("/api/meta");
  fill($("language"), meta.languages.map(([n, c]) => [`${n} [${c}]`, c]), "uk");
  regions = meta.regions;
  fill($("region"), regions.map(([n, c]) => [`${n} [${c}]`, c]), "UA");
  fill($("security"), meta.security, "Any");
  refresh();
  pollLog();
}

async function refresh() {
  addLog("Поиск устройств…");
  fill($("device"), [["Поиск…", ""]]);
  const res = await api("/api/devices");
  if (res.error) { addLog("❌ " + res.error); fill($("device"), [["Нет устройств", ""]]); return; }
  if (!res.length) {
    fill($("device"), [["Нет устройств", ""]]);
    addLog("Устройства не найдены. Проверьте кабель; разблокируйте iPhone. На Windows нужен «Apple Devices» или iTunes.");
    return;
  }
  fill($("device"), res.map(d => [d.label, d.serial]));
  addLog(`Найдено устройств: ${res.length}`);
  loadInfo();
}

async function loadInfo() {
  const box = $("info");
  const serial = $("device").value;
  if (!serial) { box.hidden = true; return; }
  box.hidden = false;
  box.textContent = "Читаю данные устройства…";
  const d = await api("/api/info", { serial });
  if (d.error) { box.textContent = "Не удалось прочитать данные: " + d.error; return; }
  const items = [
    ["Модель", d.model], ["Прошивка (iOS)", d.ios && `${d.ios} (${d.build})`],
    ["Модем", d.baseband || "—"], ["Серийный номер", d.serial], ["Активация", d.activation],
  ];
  const b = d.battery;
  if (b) {
    if (b.level != null) items.push(["Заряд", `${b.level}%${b.charging ? " ⚡" : ""}`]);
    if (b.health != null) {
      const cls = b.health >= 85 ? "good" : b.health >= 80 ? "warn" : "bad";
      items.push(["Ёмкость батареи", `<span class="${cls}">${b.health}%</span>`]);
    }
    if (b.full_mah) items.push(["Ёмкость, мАч", `${b.full_mah} из ${b.design_mah || "?"}`]);
    if (b.cycles != null) items.push(["Циклы зарядки", b.cycles]);
    if (b.temperature != null) items.push(["Температура", `${b.temperature} °C`]);
  } else {
    items.push(["Батарея", "нет данных (разблокируйте iPhone)"]);
  }
  box.innerHTML = "";
  for (const [k, v] of items) {
    const el = document.createElement("div");
    el.innerHTML = `<span>${k}</span><b>${v ?? "—"}</b>`;
    box.appendChild(el);
  }
}

function serial() {
  const s = $("device").value;
  if (!s) alert("Подключите iPhone кабелем и нажмите «Обновить».");
  return s;
}
function form() {
  return {
    serial: $("device").value,
    language: $("language").value, region: $("region").value,
    timezone: $("timezone").value, h24: $("h24").checked,
    ssid: $("ssid").value, password: $("password").value, security: $("security").value,
    hidden: $("hidden").checked, nomac: $("nomac").checked,
    activate: $("activate").checked, skip_setup: $("skip").checked, organization: $("org").value,
  };
}
async function job(path, body) {
  const res = await api(path, body);
  if (res.error) { addLog("❌ " + res.error); alert(res.error); }
}

async function pollLog() {
  try {
    const res = await api("/api/log?since=" + logNext);
    res.lines.forEach(addLog);
    logNext = res.next;
    for (const id of ["start", "wifiOnly", "erase"]) $(id).disabled = res.busy;
  } catch (e) { /* server stopped */ }
  setTimeout(pollLog, 700);
}

$("refresh").onclick = refresh;
$("device").onchange = loadInfo;
$("region").onchange = () => {
  const r = regions.find(([, c]) => c === $("region").value);
  if (r) $("timezone").value = r[2];
};
$("showPass").onchange = () => { $("password").type = $("showPass").checked ? "text" : "password"; };
$("loadLangs").onclick = async () => {
  if (!serial()) return;
  addLog("Читаю языки с устройства…");
  const res = await api("/api/languages", { serial: $("device").value });
  if (res.error) return addLog("❌ " + res.error);
  const cur = $("language").value;
  fill($("language"), res.map(c => [c, c]), cur);
  addLog(`Загружено языков: ${res.length}`);
};
$("start").onclick = () => {
  if (!serial()) return;
  if ($("skip").checked && !confirm("Устройство будет переведено в контролируемый (supervised) режим, экраны настройки будут пропущены. Снять режим можно только стиранием iPhone. Продолжить?")) return;
  job("/api/run", form());
};
$("wifiOnly").onclick = () => {
  if (!serial()) return;
  if (!$("ssid").value) return alert("Введите имя сети.");
  job("/api/wifi", form());
};
$("erase").onclick = () => {
  if (!serial()) return;
  if (!confirm("Стереть ВСЕ данные на устройстве? Это необратимо.")) return;
  job("/api/erase", { serial: $("device").value });
};
init();
</script>
</body>
</html>
